<style>:root{
  --felt:#0d3b2e; --felt2:#0a2f25; --felt3:#134a3a; --line:#1f5c49;
  --ink:#eef5f1; --mute:#9dbfb2; --gold:#e8b94a; --gold2:#c9972b;
  --red:#e2524a; --blue:#4aa3e2; --ok:#4fd18b; --card:#fbfaf6;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--felt2);color:var(--ink);font:15px/1.4 "Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 84px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--felt2),var(--felt2) 80%,transparent);padding:12px 14px 8px;display:flex;align-items:center;gap:10px}
.brand{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.3px}
.brand b{color:var(--gold)}
.top .sub{color:var(--mute);font-size:12px;margin-left:auto;text-align:right}
.banner{margin:6px 14px;padding:10px 12px;border-radius:10px;background:#3a2f12;color:#ffe2a0;font-size:13px}
.banner.info{background:#123a4a;color:#bfe6ff}
.wrap{padding:0 14px}
.card{background:var(--felt);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute)} .small{font-size:12px}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--felt3);border:1px solid var(--line);font-weight:600;cursor:pointer;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(var(--gold),var(--gold2));color:#1c1405;border-color:transparent}
.btn.red{background:#5a1f1c;border-color:#7a2b27}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.full{width:100%}
input.in,select.in{background:var(--felt2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
label.lb{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
.seg{display:flex;background:var(--felt2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--felt3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold2)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#081f18;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;border:0;background:none;padding:10px 0 12px;color:var(--mute);font-size:11px;font-weight:600;cursor:pointer;position:relative}
.nav button .i{display:block;font-size:19px;margin-bottom:2px}
.nav button.on{color:var(--gold)}
.dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}
/* table */
.felt{background:radial-gradient(ellipse at 50% 30%,#1b6a52,#0f4536 60%,#0b3529);border:2px solid #2a7a60;border-radius:22px;padding:14px;margin:10px 0;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.hinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.pot{text-align:center;margin:8px 0 4px}
.pot .amt{font-size:30px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.pot .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.board{display:flex;justify-content:center;gap:6px;min-height:72px;align-items:center;margin:8px 0;flex-wrap:wrap}
.pc{width:46px;height:66px;border-radius:7px;background:var(--card);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4);line-height:1}
.pc .r{font-size:20px}.pc .s{font-size:20px}
.pc.red{color:#c8231b}
.pc.back{background:repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 4px,#9a2b2b 4px,#9a2b2b 8px);border:2px solid #f3e7d0}
.pc.slot{background:transparent;border:1.5px dashed rgba(255,255,255,.25);box-shadow:none}
.pc.big{width:60px;height:86px}.pc.big .r,.pc.big .s{font-size:26px}
.pc.sm{width:30px;height:42px;border-radius:5px}.pc.sm .r,.pc.sm .s{font-size:13px}
.pc.hl{box-shadow:0 0 0 3px var(--gold)}
.street{text-align:center;font-size:13px;color:var(--mute)}
.street b{color:var(--ink)}
.seats{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.seat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid transparent}
.seat.turn{border-color:var(--gold);background:rgba(232,185,74,.12)}
.seat.fold{opacity:.45}
.seat .nm{font-weight:600}
.seat .meta{font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.b-d{background:var(--ink);color:#111}.b-b{background:var(--gold);color:#1c1405}.b-me{background:var(--blue);color:#fff}
.b-ai{background:var(--red);color:#fff}.b-off{background:#555;color:#fff}
.bet{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;min-width:56px}
.mine{display:flex;gap:8px;justify-content:center;margin:6px 0}
/* actions */
.act{position:sticky;bottom:72px;z-index:4}
.act .card{border-color:var(--gold2);box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:8px;justify-content:space-between;margin:10px 0}
.chip{width:56px;height:56px;border-radius:50%;border:0;font-weight:800;font-size:14px;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.85),inset 0 0 0 7px currentColor;}
.chip span{position:relative}
.c10{background:#f2f2f2;color:#3a6ea5}.c10 span{color:#1d3d63}
.c20{background:#e2524a;color:#fff}.c40{background:#2f7dd1;color:#fff}.c100{background:#1d1d1d;color:var(--gold)}
.raiseto{display:flex;align-items:center;justify-content:space-between;background:var(--felt2);border-radius:12px;padding:8px 12px}
.raiseto .v{font-size:24px;font-weight:800;color:var(--gold)}
.stack{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mini{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--mute);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:8px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
/* chat */
.msgs{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 260px);overflow-y:auto;padding:4px 0}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;background:var(--felt3)}
.msg.me{align-self:flex-end;background:#1e5f86}
.msg .w{font-size:11px;color:var(--mute);font-weight:700}
.msg.sys{align-self:center;background:transparent;color:var(--mute);font-size:12px}
.composer{display:flex;gap:6px;position:sticky;bottom:72px;background:var(--felt2);padding:8px 0}
.mic.on{background:var(--red)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--felt);border-top-left-radius:20px;border-top-right-radius:20px;padding:18px 16px 26px;width:100%;max-width:560px;border:1px solid var(--line)}
.sheet h2{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.toast.err{background:#7a2b27}
.result{text-align:center}
.result .w{font-size:18px;font-weight:800;color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--felt3);font-size:12px;margin:2px}

.rivercol{display:flex;flex-direction:column;gap:4px;margin-left:4px}
.pc.side{width:66px;height:46px;flex-direction:row;gap:4px}
.pc.side.sm{width:42px;height:30px;gap:2px}

.yourturn{position:sticky;top:58px;z-index:5;margin:6px 14px;padding:12px;border-radius:12px;text-align:center;font-weight:800;letter-spacing:1px;background:linear-gradient(var(--gold),var(--gold2));color:#1c1405;animation:pulse 1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,185,74,.7)}50%{box-shadow:0 0 0 10px rgba(232,185,74,0)}}

/* Webapprise branding */
.wa-strip{display:flex;justify-content:center;align-items:center;background:#fff;padding:4px 0;padding-top:calc(4px + env(safe-area-inset-top))}
.wa-strip img{height:22px;width:auto;display:block}
.wa-strip + .top{padding-top:10px}
.wa-hero{background:#fff;border-radius:var(--r);margin:10px 0;padding:14px 16px 16px;text-align:center}
.wa-hero .small{color:#777;letter-spacing:1px;text-transform:uppercase;font-size:10px;margin-bottom:6px}
.wa-hero img{height:48px;width:auto;max-width:100%}

.top{padding-top:calc(12px + env(safe-area-inset-top))}</style></head>

  /* ---------- hand lifecycle ---------- */
  // Online cards: only the admin's phone may hold the deck, so a dealer who isn't

  async function requestDeal() {

  let dealingNow = false;
  async function dealHand() {
    const cur = await S.store.get(handPath());
    if (cur && cur.status !== 'done') throw new Error('A hand is already running');
    // Repair: a finished hand that never got settled → settle it now.
    if (cur && cur.status === 'done' && (S.session.appliedHand || 0) < cur.no) await applyResult(cur);
    const curNo = cur ? cur.no : 0;
    let hand, prevDealer;
    await mutateSession((s) => {
      // Repair: a deal that failed halfway (hand number moved on but no hand was created).
      if ((s.appliedHand || 0) < (s.handNo || 0) && curNo < s.handNo) { s.handNo = Math.max(curNo, s.appliedHand || 0); }
      if ((s.appliedHand || 0) < (s.handNo || 0)) throw new Error('Last hand is still being settled — wait a second');
      prevDealer = s.lastDealer || null;
      s.dealRequest = null;
      const seats = seatsFor(s);
      if (seats.length < 2) throw new Error('Need at least 2 players with chips (bank gives chips in Players)');
      const dealer = nextDealer(s) || seats[Math.floor(Math.random() * seats.length)];
      const st = s.settings;
      const N = (s.handNo || 0) + 1;
      let caps = {};
      if (st.game === 'allin') {
        const waiting = capsPending(s);
        if (waiting.length) throw new Error('Waiting for all-in limits from: ' + waiting.map((p) => s.players[p].name).join(', '));
        caps = (s.capRound && s.capRound.no === N && s.capRound.caps) || {};
      }
      hand = E.startHand({
        no: N, game: st.game, mode: st.mode, seats, dealer,
        stacks: s.stacks, caps, limitStructure: st.limitStructure, lastLimit: st.lastLimit,
      });
      s.handNo = hand.no; s.lastDealer = dealer;
    });
    try {
      if (split() && hand.mode === 'online') {
        await S.store.set(secretPath(), { secret: hand.secret, key: hand.key, no: hand.no });
        const sec = E.unseal(hand.secret, hand.key);
        await Promise.all(hand.seats.map((p) => S.store.set(holePath(p), {
          uid: S.session.players[p] && !S.session.players[p].offline ? p : 'host', cards: sec.holes[p], no: hand.no,
        })));

      await S.store.set(handPath(), strip(hand));
    } catch (e) {
      // Undo the half-done deal so the table isn't stuck.
      await mutateSession((s) => { if (s.handNo === hand.no && (s.appliedHand || 0) < hand.no) { s.handNo = hand.no - 1; s.lastDealer = prevDealer; } else return false; });
      throw new Error('Could not deal — try again');
    }
    S.ui.raise = 0;
    if (hand.status === 'done') await applyResult(hand);
  }

  async function handAction(fn, opts) {
    let after;
    const seenV = S.hand && S.hand.v;
    const useSecret = split() && isAdmin() && S.hand && S.hand.mode === 'online';
    const sec = useSecret ? await S.store.get(secretPath()) : null;
    const step = (h) => {
      if (!h) throw new Error('No hand running');
      if (seenV && h.v !== seenV && !(opts && opts.ignoreV)) throw new Error('Table just changed — look again');
      after = fn(attach(h, sec));
      return strip(after);
    };
    if (S.store.mutate) await S.store.mutate(handPath(), step);
    else await S.store.lock(handPath(), async () => { const h = await S.store.get(handPath()); await S.store.set(handPath(), step(h)); });
    if (useSecret && after && sec && after.secret && after.secret !== sec.secret) {
      await S.store.set(secretPath(), { secret: after.secret, key: after.key, no: after.no });

  let resuming = false;

  /* ---------- voice notes (own hosting) ---------- */
  let rec = null, recChunks = [], recTimer = null, recStart = 0, recTick = null;

      rec = null; render();
      if (dur < 1 || !blob.size) return;
      const url = await blobToDataURL(blob);
      if (url.length > 900000) throw new Error('Voice note too long');
      await S.store.add(sessPath() + '/chat', { by: S.me.id, name: nm(S.me.id), audio: url, dur, ts: Date.now() });
    });
    rec = r;
    r.start();
    recStart = Date.now();
    recTimer = setTimeout(() => { if (rec) rec.stop(); }, 30000);
    recTick = setInterval(render, 1000);
    render();
  }

  /* ---------- dictation (voice → text) ---------- */
  let dictState = 'idle';
  async function setupDictation() {
    if (S.store.dictationReady) S.store.dictation = await S.store.dictationReady;
    const d = S.store.dictation;
    if (!d) return;
    render();
    d.onPartial(({ text }) => { S.ui.partial = text; render(); });
    d.onFinal(({ text }) => {
      S.ui.chat = (S.ui.chat ? S.ui.chat + text : text.replace(/^\s+/, ''));
      S.ui.partial = ''; render();
    });
    d.onState(({ state, reason }) => {
      dictState = state;
      if (state === 'idle' && reason === 'not_granted') toast('Microphone not allowed — use your keyboard mic', true);
      render();
    });
  }
  function toggleMic() {
    const d = S.store.dictation;
    if (!d) return;
    if (d.active()) { d.stop(); return; }
    d.start().catch((e) => { if (e && e.code !== 'stopped') toast('Voice not available here — use your keyboard mic', true); });
  }

  /* ---------- subscriptions ---------- */
  function subscribeSession(sid) {
    S.unsub.forEach((u) => { try { u(); } catch (e) {} });
    S.unsub = [];
    S.sid = sid; S.session = null; S.hand = null; S.history = []; S.chat = [];
    S.secretSub = null; S.secret = null; S.myHole = null; holeFetch = null;
    if (!sid) { render(); return; }
    S.unsub.push(S.store.onDoc('sessions/' + sid, (d) => {
      const wasPending = limitPendingForMe();
      S.session = d;
      if (d && S.announceNight === d.id) {
        S.announceNight = null;
        if (d.adminId !== S.me.id) {
          const host = (d.players[d.adminId] && d.players[d.adminId].name) || 'A friend';
          toast('🎲 ' + host + ' started "' + d.name + '" — join now!');
          alertMe(host + ' started a poker night');
        }
      }
      if (!wasPending && limitPendingForMe()) alertMe('Set your all-in limit');
      if (d && d.dealRequest && d.dealRequest.forHand === (d.handNo || 0) + 1 && isAdmin() && !dealingNow) {
        dealingNow = true;
        setTimeout(() => run(async () => {
          try { await dealHand(); }
          catch (e) { await mutateSession((s) => { s.dealRequest = null; }); throw e; }
        }).finally(() => { dealingNow = false; }), 200);
      }
      if (d && split() && !S.secretSub && (d.adminId === S.me.id || S.store.isOwner)) {
        S.secretSub = S.store.onDoc('sessions/' + sid + '/secret/hand', (x) => { S.secret = x; render(); }, () => {});
        S.unsub.push(S.secretSub);
      }
      render();
    }, onErr));
    S.unsub.push(S.store.onDoc('sessions/' + sid + '/live/hand', onHand, onErr));
    S.unsub.push(S.store.onQuery('sessions/' + sid + '/hands', { orderBy: 'no', dir: 'desc', limit: 60 }, (rows) => { S.history = rows; render(); }, onErr));
    S.unsub.push(S.store.onQuery('sessions/' + sid + '/chat', { orderBy: 'ts', dir: 'desc', limit: 50 }, (rows) => { S.chat = rows.reverse(); render(); }, onErr));
  }
  function onHand(d) {
      const wasActor = actorPid();
      const prevKey = S.hand && S.hand.no + ':' + S.hand.toAct;
      S.hand = d;
      const nowActor = actorPid();
      if (nowActor && (nowActor !== wasActor || prevKey !== d.no + ':' + d.toAct)) notifyTurn(nowActor);
      // Fallback: if a finished hand wasn't settled (someone's phone dropped), the admin settles it.
      if (d && split() && d.mode === 'online' && d.seats.includes(S.me.id) && d.status !== 'done' && !(S.myHole && S.myHole.no === d.no)) fetchMyHole(d.no);
      if (d && split() && isAdmin() && (d.status === 'dealing' || d.status === 'reveal')) setTimeout(() => run(hostResume), 300);
      clearTimeout(S.applyTimer);
      if (d && d.status === 'done' && S.session && (S.session.appliedHand || 0) < d.no && isAdmin()) {
        S.applyTimer = setTimeout(() => run(() => applyResult(d)), 2500);
      }
      render();
  }
  // Safety net: if live updates stall (Safari, weak network), check the table every few seconds.
  async function pollTable() {
    if (!S.sid || document.hidden || !S.store || S.store.kind !== 'firebase') return;
    try {
      const d = await S.store.get(handPath());
      if (d && (!S.hand || d.no !== S.hand.no || d.v !== S.hand.v || d.status !== S.hand.status)) onHand(d);
    } catch (e) {}
  }
  setInterval(pollTable, 6000);
  async function refreshAll() {
    if (!S.sid || !S.store || S.store.kind !== 'firebase') return;
    try {
      const sd = await S.store.get(sessPath()); if (sd) { S.session = sd; render(); }
    } catch (e) {}
    pollTable();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(); });
  window.addEventListener('online', refreshAll);
  window.addEventListener('pageshow', refreshAll);
  function onErr(e) {
    console.warn('store error', e);
    S.connErr = (e && (e.code || e.message)) || 'error';
    render();
  }

  /* ---------- rendering ---------- */
  function render() {
    const playing = [...document.querySelectorAll('audio')].some((a) => !a.paused);
    if (playing && S.tab === 'chat') { clearTimeout(S.rerender); S.rerender = setTimeout(render, 800); return; }
    if (!S.ready) { $app.innerHTML = `<div class="empty" style="padding-top:40vh">Shuffling the deck…</div>`; return; }
    const ae = document.activeElement;
    const focusKey = ae && ae.dataset && ae.dataset.bind;
    const selStart = ae && ae.selectionStart;
    const scrollMsgs = document.querySelector('.msgs');
    const atBottom = scrollMsgs ? scrollMsgs.scrollHeight - scrollMsgs.scrollTop - scrollMsgs.clientHeight < 40 : true;

    let body = '';
    const banners = [];
    if (S.store.kind === 'memory') banners.push(`<div class="banner info">Preview mode — data stays on this device only. Open the shared link signed in to play with friends.</div>`);
    if (S.connErr) banners.push(`<div class="banner">Connection problem (${esc(S.connErr)}). Close the page and open the link again in a minute.</div>`);
    if (S.store.canWrite === false) banners.push(`<div class="banner">You can watch but not play. Ask the host to invite you as an <b>Editor</b>.</div>`);

    if (!S.session || S.session.status === 'closed') body = lobbyView();
    else if (!isPlayer() && !isAdmin()) body = joinView();
    else if (S.tab === 'table') body = tableView();
    else if (S.tab === 'players') body = playersView();
    else if (S.tab === 'hands') body = handsView();
    else if (S.tab === 'chat') body = chatView();
    else if (S.tab === 'settle') body = settleView();

    const top = `<div class="top"><div class="brand">♠ Poker <b>Night</b></div><button class="btn sm ghost" data-act="sound" title="Turn alerts">${soundOn ? '🔊' : '🔇'}</button><div class="sub">${S.session && S.session.status === 'open' ? esc(S.session.name) + ' · ' + (S.session.settings.mode === 'online' ? 'online' : 'real cards') + '<br>' + hostLine(S.session) + '<br>' : ''}${esc(S.me.name || '')}${S.session && isAdmin() ? ' · admin' : ''}</div></div>`;
    const showNav = S.session && S.session.status === 'open' && (isPlayer() || isAdmin());
    const unread = S.chat.length && S.chat[S.chat.length - 1].ts > S.lastSeenChat && S.tab !== 'chat' && S.chat[S.chat.length - 1].by !== S.me.id;
    const myTurn = S.hand && S.hand.status === 'betting' && actorPid();
    const nav = showNav ? `<div class="nav"><div class="in">
      ${navBtn('table', '🂡', 'Table', myTurn && S.tab !== 'table')}
      ${navBtn('players', '👥', 'Players', isAdmin() && S.session.requests && Object.keys(S.session.requests).length)}
      ${navBtn('hands', '📜', 'Hands')}
      ${navBtn('chat', '💬', 'Chat', unread)}
      ${navBtn('settle', '🧮', 'Settle')}
    </div></div>` : '';
    if (!myTurn && S.session && limitPendingForMe()) banners.unshift(`<div class="yourturn" data-act="modal" data-m="cap">🔔 SET YOUR ALL-IN LIMIT · HAND #${(S.session.handNo || 0) + 1}</div>`);
    if (myTurn) banners.unshift(`<div class="yourturn" data-act="tab" data-v="table">🔔 ${actorPid() === S.me.id ? 'YOUR TURN' : esc(nm(actorPid())) + "'S TURN (you play for them)"}</div>`);
    const inLobby = !S.session || S.session.status === 'closed';
    const strip = window.WA_LOGO && !inLobby ? `<div class="wa-strip"><img src="${window.WA_LOGO}" alt="Webapprise"></div>` : '';
    $app.innerHTML = strip + top + banners.join('') + `<div class="wrap">${body}</div>` + nav + modalView();

    if (focusKey) {
      const el = $app.querySelector(`[data-bind="${focusKey}"]`);
      if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} }
    }
    const m = document.querySelector('.msgs');
    if (m && atBottom) m.scrollTop = m.scrollHeight;
    if (S.tab === 'chat' && S.chat.length) S.lastSeenChat = S.chat[S.chat.length - 1].ts;
    document.title = (myTurn ? '🔔 Your turn · ' : '') + 'Poker Night';
  }
  const navBtn = (t, i, l, dot) => `<button data-act="tab" data-v="${t}" class="${S.tab === t ? 'on' : ''}"><span class="i">${i}</span>${l}${dot ? '<span class="dot"></span>' : ''}</button>`;

  function lobbyView() {
    let h = window.WA_LOGO ? `<div class="wa-hero"><div class="small">Presented by</div><img src="${window.WA_LOGO}" alt="Webapprise — Get it done"></div>` : '';
    if (S.store.canWrite !== false) {
      h += `<div class="card"><h3>Start a new night</h3>
        <div class="small mute" style="margin-bottom:6px">No game is running. Whoever starts the night becomes its admin, and everyone else who opens the link joins it.</div>
        <label class="lb">Name for tonight (optional)</label>
        <input class="in" data-bind="newNight" placeholder="Friday game" value="${esc(S.ui.newNight)}">
        <label class="lb">Your name at the table</label>
        <input class="in" data-bind="nick" placeholder="${esc(S.me.name || 'Host')}" value="${esc(S.ui.nick)}">
        <label class="lb">Cards for the whole night</label>
        <div class="seg"><button class="${S.ui.newMode !== 'online' ? 'on' : ''}" data-act="newMode" data-v="physical">Real cards</button><button class="${S.ui.newMode === 'online' ? 'on' : ''}" data-act="newMode" data-v="online">Online (app deals)</button></div>
        <div class="small mute" style="margin-top:6px">${S.ui.newMode === 'online' ? 'The app shuffles and deals. Everyone sees their cards on their phone.' : 'You deal real cards. The app handles chips, bets and accounts.'} This can't be changed once the night starts.</div>
        <div style="height:10px"></div>
        <button class="btn gold full" data-act="startNight">Start night</button></div>`;
    } else {
      h += `<div class="card empty">No game running right now.<br>The host will start one — keep this page open.</div>`;
    }
    h += pastNightsView();
    return h;
  }

  function hostLine(s) {
    if (!s) return '';
    const pl = s.players && s.players[s.adminId];
    const who = s.adminId === S.me.id ? 'you' : (pl && pl.name) || 'someone';
    const at = s.createdAt ? new Date(s.createdAt).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : '';
    return `Started by <b style="color:var(--ink)">${esc(who)}</b>${at ? ' at ' + at : ''}`;
  }

  function joinView() {
    const s = S.session;
    const req = s.requests && s.requests[S.me.id];
    return `<div class="card"><h3>${esc(s.name)}</h3>
      <div class="small mute" style="margin-bottom:8px">${hostLine(s)}</div>
      ${req ? `<div class="empty">Waiting for ${esc((s.players[s.adminId] && s.players[s.adminId].name) || 'the host')} to add you…</div>` : `
      <label class="lb">Your name at the table</label>
      <input class="in" data-bind="nick" placeholder="${esc(S.me.name || 'Your name')}" value="${esc(S.ui.nick)}">
      <div style="height:10px"></div><button class="btn gold full" data-act="join">Ask to join</button>`}
      <div class="small mute" style="margin-top:10px">${pids().length} player(s) at the table</div></div>`;
  }

  function tableView() {
    const s = S.session, h = S.hand;
    let out = '';
    const handActive = h && h.no === s.handNo;
    if (!handActive || h.status === 'done') {
      if (handActive && h.status === 'done') out += resultCard(h);
      out += setupCard();
      if (!s.bankId) out += `<div class="banner">No bank yet. ${isAdmin() ? 'Go to <b>Players</b> → pick the bank randomly.' : 'The host will pick one.'}</div>`;
      out += seatsPreview();
      return out;
    }
    const g = E.GAMES[h.game];
    const pot = E.potTotal(h);
    const street = h.status === 'showdown' || h.status === 'reveal' ? 'Showdown' : E.STREETS[h.street];
    const limit = h.limits ? ` · limit <b>${rs(h.limits[h.street] || 0)}</b>/round` : '';
    // Board
    let board = '';
    if (h.mode === 'online') {
      board = boardHTML(h.board, h.game, '', true);
    } else {
      const say = h.status === 'showdown' ? 'Show your cards!' : ['Deal ' + g.hole + ' cards to each player', 'Deal the flop (3 cards)', 'Deal the turn (1 card)', 'Deal the river (' + g.board[3] + ' card' + (g.board[3] > 1 ? 's' : '') + ')'][h.street];
      board = `<div class="mute" style="text-align:center">🃏 Physical cards<br><b style="color:var(--ink)">${say}</b></div>`;
    }
    out += `<div class="felt">
      <div class="hinfo"><span>Hand #${h.no} · ${esc(g.label)}</span><span>${h.mode === 'online' ? 'Online' : 'Real cards'}</span></div>
      <div class="pot"><div class="lbl">Pot</div><div class="amt">${rs(pot)}</div><div class="small mute">incl. ${rs(h.dabba)} dabba from ${esc(nm(h.dealer))}</div></div>
      <div class="board">${board}</div>
      <div class="street"><b>${street}</b>${h.status === 'betting' ? limit : ''}</div>
      <div class="seats">${h.seats.map((p) => seatRow(h, p)).join('')}</div>
    </div>`;
    // my cards
    if (h.mode === 'online' && h.seats.includes(S.me.id)) {
      const mine = cardsOf(S.me.id) || [];
      let hint = '';
      if (mine.length && h.board.length >= 3 && !h.folded[S.me.id]) { const b = E.bestFor(h.game, mine, h.board); hint = `<div class="small mute" style="text-align:center">You have: <b style="color:var(--ink)">${b.name}</b></div>`; }
      out += `<div class="card" style="padding:10px"><div class="mine">${mine.map((c) => cardHTML(c, 'big')).join('')}</div>${hint}</div>`;
    }
    // change bet
    if (E.canChange(h, S.me.id) || (isAdmin() && h.lastActor && S.session.players[h.lastActor]?.offline && E.canChange(h, h.lastActor))) {
      out += `<button class="btn full" data-act="change" style="margin:6px 0">↩︎ Change ${h.lastActor === S.me.id ? 'my' : esc(nm(h.lastActor)) + "'s"} last move</button>`;
    }
    if (h.status === 'dealing' || h.status === 'reveal') out += `<div class="card small mute" style="text-align:center">Dealing… (the host's phone deals the cards — keep it open)</div>`;
    if (h.status === 'betting') out += actionPanel(h);
    if (h.status === 'showdown') out += showdownPicker(h);
    return out;
  }

  function seatRow(h, p) {
    const pl = S.session.players[p] || {};
    const turn = h.status === 'betting' && h.toAct === p;
    let badges = '';
    if (p === h.dealer) badges += '<span class="badge b-d">D</span>';
    if (p === S.session.bankId) badges += '<span class="badge b-b">BANK</span>';
    if (p === S.me.id) badges += '<span class="badge b-me">YOU</span>';
    if (pl.offline) badges += '<span class="badge b-off">OFFLINE</span>';
    if (h.allin[p] && !h.folded[p]) badges += '<span class="badge b-ai">ALL-IN</span>';
    let meta = `Behind ${rs(h.behind[p])} · in pot ${rs(h.contrib[p])}`;
    if (h.game === 'allin' && h.start[p] < (S.session.stacks[p] || 0)) meta += ` · limit ${rs(h.start[p])}`;
    const last = [...h.log].reverse().find((e) => e.p === p && e.t !== 'dabba' && e.s === h.street);
    let status = '';
    if (h.folded[p]) status = 'Folded';
    else if (turn) status = '⏳ Thinking…';
    else if (last) status = { check: 'Check', call: 'Call', bet: 'Bet', raise: 'Raise', fold: 'Fold' }[last.t] || '';
    let cards = '';
    if (h.mode === 'online') {
      if (h.shown && h.shown[p]) cards = `<div class="row" style="gap:3px">${h.shown[p].cards.map((c) => cardHTML(c, 'sm')).join('')}</div>`;
      else if (!h.folded[p] && p !== S.me.id) cards = `<div class="row" style="gap:3px">${Array(E.GAMES[h.game].hole).fill(cardHTML('??', 'sm')).join('')}</div>`;
    }
    return `<div class="seat ${turn ? 'turn' : ''} ${h.folded[p] ? 'fold' : ''}">

  }

  function actionPanel(h) {
    const actor = actorPid();
    if (!actor) {

    const r = S.ui.raise;
    const raiseOk = o.canRaise && r > h.currentBet && r <= o.maxTotal;

      <div class="row" style="margin-bottom:8px"><b class="grow" style="color:var(--gold)">${forWho}</b>
        <span class="small mute">You have ${rs(o.behind)}${o.roundBet ? ' · in ' + rs(o.roundBet) : ''}${isFinite(o.cap) ? ' · round max ' + rs(o.cap) : ''}</span></div>
      ${o.canRaise ? `
      <div class="raiseto"><div><div class="small mute">${word}${r <= h.currentBet ? ' · tap chips' : ''}</div><div class="v">${rs(r)}</div></div>
        <div class="row"><button class="btn sm" data-act="rz" data-v="clear">Reset</button><button class="btn sm" data-act="rz" data-v="max">${h.game === 'allin' ? 'All-in' : 'Max'}</button></div></div>
      <div class="chips">${E.CHIPS.slice().reverse().map((c) => `<button class="chip c${c}" data-act="rz" data-v="${c}"><span>+${c}</span></button>`).join('')}</div>` : ''}
      <div class="btns">
        <button class="btn red" data-act="fold">Fold</button>
        ${o.canCheck ? `<button class="btn" data-act="check">Check</button>` : `<button class="btn" data-act="call">Call ${rs(o.callAmt)}${o.callAmt < o.toCall ? ' (all-in)' : ''}</button>`}
        ${o.canRaise ? `<button class="btn gold" style="grid-column:1/3" data-act="raise" ${raiseOk ? '' : 'disabled'}>${isAllIn ? 'ALL-IN ' + rs(r) : word + ' ' + rs(r)}</button>` : ''}
      </div></div></div>`;
  }

  function showdownPicker(h) {
    if (!isAdmin()) return `<div class="card small mute" style="text-align:center">Show your cards — the host picks the winner.</div>`;
    const contested = h.pots.map((p, i) => ({ ...p, i })).filter((p) => p.eligible.length > 1);
    return `<div class="act"><div class="card"><h3>Who won?</h3>
      ${contested.map((p) => `<div style="margin-bottom:10px"><div class="small mute">${h.pots.length > 1 ? (p.i === 0 ? 'Main pot' : 'Side pot ' + p.i) + ' · ' : ''}${rs(p.amt)} — tap winner (tap 2+ to split)</div>
        <div class="row wrapr" style="margin-top:6px">${p.eligible.map((pid) => {
          const on = (S.ui.potPick[p.i] || []).includes(pid);
          return `<button class="btn sm ${on ? 'gold' : ''}" data-act="pick" data-pot="${p.i}" data-v="${esc(pid)}">${esc(nm(pid))}</button>`;
        }).join('')}</div></div>`).join('')}
      <button class="btn gold full" data-act="resolve">Confirm winner</button></div></div>`;
  }

  function resultCard(h) {
    const res = h.result;
    const winners = Object.entries(res.delta).filter(([, d]) => d > 0).sort((a, b) => b[1] - a[1]);
    let shown = '';
    if (h.shown) {
      shown = `<div class="seats" style="margin-top:10px">` + Object.entries(h.shown).map(([p, v]) => `<div class="seat"><div class="grow"><div class="nm">${esc(nm(p))}</div><div class="meta">${esc(v.name)}</div></div><div class="row" style="gap:3px">${v.cards.map((c) => cardHTML(c, 'sm' + (v.best.includes(c) ? ' hl' : ''))).join('')}</div></div>`).join('') + `</div>`;
    }
    return `<div class="felt result"><div class="hinfo"><span>Hand #${h.no} result</span><span>${res.how === 'fold' ? 'Others folded' : 'Showdown'}</span></div>
      ${h.board && h.board.length ? `<div class="board">${boardHTML(h.board, h.game, '')}</div>` : '<div style="height:8px"></div>'}
      ${(winners.length ? winners : Object.entries(res.payout).filter(([, x]) => x > 0)).map(([p, d]) => `<div class="w">🏆 ${esc(nm(p))} wins ${rs(res.payout[p])} <span class="small mute">(${sgn(res.delta[p])})</span></div>`).join('')}
      ${shown}
      ${isAdmin() && h.game === 'limit' && h.mode === 'online' && res.how === 'showdown' && !h.rejudged && h.no === S.session.handNo
        ? `<button class="btn gold full" style="margin-top:10px" data-act="rejudge">Re-check this hand (new rules)</button>` : ''}
      ${h.rejudged ? '<div class="small mute" style="margin-top:6px">✔ Re-checked with current rules</div>' : ''}</div>`;
  }
  async function rejudgeLast() {
    const cur = await S.store.get(handPath());
    const r = E.rejudge(cur);
    if (!r) throw new Error('Nothing to re-check');
    if (cur.rejudged) throw new Error('Already re-checked');
    const changed = Object.values(r.diff).some((d) => d);
    // fix balances first (only if the old result was already added)
    await mutateSession((s) => {
      if ((s.appliedHand || 0) < cur.no) return false;
      for (const p in r.diff) s.stacks[p] = (s.stacks[p] || 0) + r.diff[p];
      logEntry(s, { t: 'rejudge', no: cur.no, diff: r.diff });
    });
    await mutate(handPath(), (h) => (h && h.no === cur.no && !h.rejudged ? strip(r.hand) : false));
    const names = {}; r.hand.seats.forEach((p) => (names[p] = nm(p)));
    await S.store.set(sessPath() + '/hands/h' + String(cur.no).padStart(5, '0'), {
      no: cur.no, ts: Date.now(), game: cur.game, mode: cur.mode, dealer: cur.dealer, board: cur.board || [],
      pots: r.hand.result.pots.map((p) => ({ amt: p.amt, winners: p.winners })), delta: r.hand.result.delta, how: 'showdown', names, rejudged: true,
      shown: Object.fromEntries(Object.entries(r.hand.shown).map(([p, v]) => [p, { cards: v.cards, name: v.name }])),
    });
    toast(changed ? 'Result corrected — chips updated' : 'Checked — the winner stays the same');
  }

  // Re-check an earlier hand of tonight with the current rules and fix chips by the difference.
  async function rejudgeHistory(no) {
    const r = S.history.find((x) => x.no === no);
    if (!r) throw new Error('Hand not found');
    if (r.rejudged) throw new Error('Already re-checked');
    if (!r.shown || r.how !== 'showdown') throw new Error('Nothing to re-check (no showdown)');
    if ((r.pots || []).length !== 1) throw new Error('This hand had side pots — tell Claude the hand number to fix it');
    const players = Object.keys(r.shown);
    const val = {};
    for (const p of players) { const b = E.bestFor(r.game, r.shown[p].cards, r.board || []); val[p] = b; }
    let best = null, winners = [];
    for (const p of players) { const c = best ? E.cmp(val[p].value, best) : 1; if (c > 0) { best = val[p].value; winners = [p]; } else if (c === 0) winners.push(p); }
    const seats = Object.keys(r.delta);
    const pot = r.pots[0];
    const oldPay = E.splitPot(pot.amt, pot.winners, seats);
    const newPay = E.splitPot(pot.amt, winners, seats);
    const diff = {}, newDelta = {};
    for (const p of seats) {
      const contrib = (oldPay[p] || 0) - (r.delta[p] || 0);
      newDelta[p] = (newPay[p] || 0) - contrib;
      diff[p] = newDelta[p] - (r.delta[p] || 0);
    }
    const changed = Object.values(diff).some((d) => d);
    if (changed) {
      await mutateSession((s) => {
        for (const p in diff) s.stacks[p] = (s.stacks[p] || 0) + diff[p];
        logEntry(s, { t: 'rejudge', no, diff });
      });
    }
    await S.store.set(sessPath() + '/hands/h' + String(no).padStart(5, '0'), {
      ...r, id: undefined, delta: newDelta, pots: [{ amt: pot.amt, winners }], rejudged: true,
      shown: Object.fromEntries(players.map((p) => [p, { cards: r.shown[p].cards, name: val[p].name }])),
    });
    if (S.hand && S.hand.no === no && S.hand.status === 'done') {
      await mutate(handPath(), (h) => (h && h.no === no ? { ...h, rejudged: true } : false));
    }
    toast(changed ? 'Hand #' + no + ' corrected — chips updated' : 'Hand #' + no + ' checked — winner stays the same');
  }

  function handRows(rows, nameFn, canFix) {

      const shown = r.shown ? `<div class="small mute" style="margin-top:2px">${Object.entries(r.shown).map(([p, v]) => `${esc(name(p))}: ${(v.cards || []).map((c) => c[0].replace('T', '10') + { s: '♠', h: '♥', d: '♦', c: '♣' }[c[1]]).join(' ')} (${esc(v.name)})`).join(' · ')}</div>` : '';
      return `<div class="li" style="flex-wrap:wrap"><div class="grow"><div><b>#${r.no}</b> <span class="small mute">${esc((E.GAMES[r.game] || {}).short || '')} · ${r.how === 'fold' ? 'won uncontested' : 'showdown'}${r.rejudged ? ' · re-checked' : ''}</span></div>
        <div class="small">${ws.length ? ws.map(([p, d]) => `🏆 ${esc(name(p))} <span class="pos">${sgn(d)}</span>`).join(' · ')
          : [...new Set((r.pots || []).flatMap((x) => x.winners || []))].map((p) => `🏆 ${esc(name(p))} <span class="mute">won the pot back (₹0)</span>`).join(' · ')}</div>
        <div class="small mute">${Object.entries(r.delta || {}).filter(([, d]) => d < 0).map(([p, d]) => `${esc(name(p))} <span class="neg">${sgn(d)}</span>`).join(' · ')}</div>${shown}</div>
        ${r.board && r.board.length ? `<div class="row" style="gap:2px">${boardHTML(r.board, r.game, 'sm')}</div>` : ''}
        ${canFix && r.how === 'showdown' && r.shown && r.game === 'limit' && !r.rejudged ? `<button class="btn sm" style="width:100%;margin-top:6px" data-act="rejudgeNo" data-v="${r.no}">Re-check hand #${r.no} (new rules)</button>` : ''}</div>`;
    }).join('');
  }

    const amtPicker = () => `<div class="raiseto" style="margin:10px 0"><div class="v">${rs(S.ui.amt)}</div><button class="btn sm" data-act="amt" data-v="clear">Reset</button></div>
      <div class="row wrapr">${[100, 500, 1000, 2000, 5000].map((a) => `<button class="btn sm" data-act="amt" data-v="${a}">+${a}</button>`).join('')}</div>
      <div class="chips">${E.CHIPS.slice().reverse().map((c) => `<button class="chip c${c}" data-act="amt" data-v="${c}"><span>+${c}</span></button>`).join('')}</div>`;
    if (m.type === 'cap') {
      const s = S.session;
      const last = (s.caps || {})[S.me.id] || 0;
      const N = (s.handNo || 0) + 1;
      inner = `<h2>Your all-in limit · hand #${N}</h2><div class="small mute">You have ${rs(s.stacks[S.me.id] || 0)}. This is the most you'll risk this hand.</div>
        <button class="btn gold full" style="margin:14px 0 8px;font-size:17px;min-height:54px" data-act="capSameClose" data-v="${last}">✔ ${last ? rs(last) : 'No limit'}${last ? ' (same as last)' : ''}</button>
        <label class="lb">Or type a different amount</label>
        <div class="row"><input class="in grow" type="number" inputmode="numeric" step="10" min="0" data-bind="cap" value="${esc(S.ui.cap != null ? S.ui.cap : (last || ''))}"><button class="btn" data-act="setCapClose">Set</button></div>
        <button class="btn full" style="margin-top:8px" data-act="capNoneClose">No limit</button>`;
    } else if (m.type === 'give') {
      inner = `<h2>🏦 Bank gives chips to ${esc(nm(m.pid))}</h2><div class="small mute">${esc(nm(m.pid))} will owe the bank this amount.</div>${amtPicker()}
        <button class="btn gold full" data-act="doGive">Give ${rs(S.ui.amt)}</button>`;
    } else if (m.type === 'lend') {
      inner = `<h2>Lend to ${esc(nm(m.pid))}</h2><div class="small mute">From your chips (${rs(S.session.stacks[S.me.id] || 0)}). ${esc(nm(m.pid))} will owe you.</div>${amtPicker()}
        <button class="btn gold full" data-act="doLend">Lend ${rs(S.ui.amt)}</button>`;
    } else if (m.type === 'end') {
      inner = `<h2>End the night for everyone?</h2><div class="small mute" style="margin-bottom:12px">The table closes for all players and the final result is saved. This can't be undone.${handLive() ? ' <b>The hand in progress will be cancelled and everyone gets back what they put in the pot.</b>' : ''} (To just peek at standings, the Settle tab already shows them live.)</div>
        <button class="btn red full" data-act="doEnd">Yes, end and save results</button>`;
    }
    return `<div class="modal" data-act="closeModal"><div class="sheet" data-stop="1">${inner}<div style="height:8px"></div><button class="btn ghost full" data-act="closeModal">Cancel</button></div></div>`;
  }

  /* ---------- events ---------- */
  document.addEventListener('input', (e) => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k) S.ui[k] = e.target.value;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bind === 'chat') { e.preventDefault(); run(sendChat); }
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
    const a = el.dataset.act, v = el.dataset.v;
    const h = S.hand;
    switch (a) {
      case 'mic': toggleMic(); return; // must run synchronously in the click
      case 'sound': soundOn = !soundOn; try { localStorage.setItem('poker-sound', soundOn ? 'on' : 'off'); } catch (e) {} toast(soundOn ? 'Turn alerts on 🔊' : 'Turn alerts muted (vibration only)'); if (soundOn) { unlockAudio(); beep(); } render(); return;
      case 'rec': return run(toggleRecord);
      case 'tab': S.tab = v; render(); window.scrollTo(0, 0); return;
      case 'startNight': return run(startNight);
      case 'newMode': S.ui.newMode = v; render(); return;
      case 'join': return run(requestJoin);
      case 'approve': return run(() => approve(v, el.dataset.yes === '1'));
      case 'addOffline': return run(addOffline);
      case 'out': return run(() => toggleOut(v));
      case 'pickBank': return run(pickBank);
      case 'setCap': return run(async () => { await setCap(S.ui.cap); S.ui.cap = null; });
      case 'capNone': return run(async () => { await setCap(0); S.ui.cap = null; });
      case 'capSameClose': return run(async () => { await setCap(Number(v)); S.ui.cap = null; S.ui.modal = null; render(); });
      case 'setCapClose': return run(async () => { await setCap(S.ui.cap); S.ui.cap = null; S.ui.modal = null; render(); });
      case 'capNoneClose': return run(async () => { await setCap(0); S.ui.cap = null; S.ui.modal = null; render(); });
      case 'capSame': return run(async () => { await setCap(Number(v)); S.ui.cap = null; });
      case 'setting': if (el.dataset.k === 'mode') return; return run(() => saveSettings({ [el.dataset.k]: el.dataset.k === 'lastLimit' ? Number(v) : v }));
      case 'deal': return run(requestDeal);
      case 'rejudge': return run(rejudgeLast);
      case 'rejudgeNo': return run(() => rejudgeHistory(Number(v)));
      case 'rz': {
        const o = E.options(h, actorPid());
        if (!o) return;
        if (v === 'clear') S.ui.raise = h.currentBet;
        else if (v === 'max') S.ui.raise = o.maxTotal;
        else {
          const base = S.ui.raise <= h.currentBet ? h.currentBet : S.ui.raise;
          S.ui.raise = Math.min(o.maxTotal, base + Number(v));
        }
        render(); return;
      }
      case 'fold': return run(() => handAction((x) => E.act(x, actorPid(), { type: 'fold' })));
      case 'check': return run(() => handAction((x) => E.act(x, actorPid(), { type: 'check' })));
      case 'call': return run(() => handAction((x) => E.act(x, actorPid(), { type: 'call' })));
      case 'raise': { const t = S.ui.raise; return run(() => handAction((x) => E.act(x, actorPid(), { type: 'raise', total: t }))); }
      case 'change': {
        const who = E.canChange(h, S.me.id) ? S.me.id : h.lastActor;
        return run(() => handAction((x) => E.changeBet(x, who)));
      }
      case 'pick': {
        const i = Number(el.dataset.pot);
        const cur = S.ui.potPick[i] || [];
        S.ui.potPick[i] = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v);
        render(); return;
      }
      case 'resolve': {
        const picks = h.pots.map((_, i) => S.ui.potPick[i] || []);
        return run(async () => { await handAction((x) => E.resolveShowdown(x, picks)); S.ui.potPick = {}; });
      }
      case 'repay': return run(() => lend(el.dataset.from, el.dataset.to, Number(v), 'repay'));
      case 'modal': S.ui.modal = { type: el.dataset.m, pid: v }; S.ui.amt = 0; render(); return;
      case 'closeModal': S.ui.modal = null; render(); return;
      case 'amt': S.ui.amt = v === 'clear' ? 0 : S.ui.amt + Number(v); render(); return;
      case 'doGive': return run(async () => { await giveChips(S.ui.modal.pid, S.ui.amt); S.ui.modal = null; render(); });
      case 'doLend': return run(async () => { await lend(S.me.id, S.ui.modal.pid, S.ui.amt); S.ui.modal = null; render(); });
      case 'doEnd': return run(async () => { const id = S.sid; await endNight(); S.ui.modal = null; S.tab = 'table'; S.ui.endedId = id; render(); });
      case 'send': return run(sendChat);
      case 'viewNight': openNight(v || null); return;
      case 'moreNights': {
        S.ui.pastShow = (S.ui.pastShow || 10) + 10;
        if (S.nightsLimit < S.ui.pastShow + 2) { S.nightsLimit = S.ui.pastShow + 11; subscribeNights(); }
        render(); return;
      }
      case 'handsTab': S.ui.handsTab = v; if (v === 'tonight') openNight(null); else render(); return;
    }
  });

  S.nightsLimit = 21;
  function subscribeNights() {
    if (S.nightsUnsub) { try { S.nightsUnsub(); } catch (e) {} }
    S.nightsUnsub = S.store.onQuery('sessions', { orderBy: 'createdAt', dir: 'desc', limit: S.nightsLimit }, (rows) => { S.nights = rows; render(); }, onErr);
  }

  /* ---------- boot ---------- */
  (async function boot() {
    render();
    S.store = await window.PokerStore.createStore();
    S.me = S.store.me;
    S.ready = true;
    if (S.store.kind === 'blocked') {
      $app.innerHTML = `<div class="top"><div class="brand">♠ Poker <b>Night</b></div></div><div class="wrap"><div class="card"><h3>Can't reach the table</h3>
        <p>This page couldn't connect to the shared game.</p>
        ${window.FIREBASE_CONFIG ? `<ol class="small" style="padding-left:18px;line-height:1.7"><li>Check your internet connection.</li><li>Open the link in Chrome or Safari, not inside WhatsApp or another app.</li><li>Close and open the link again.</li></ol>` : `<ol class="small" style="padding-left:18px;line-height:1.7"><li>Make sure you're signed in to Claude with the email the host invited.</li><li>Ask the host to check your access is <b>Editor</b>.</li><li>Open the link in Chrome or Safari, not inside another app.</li><li>Close and open the link again.</li></ol>`}
        <div class="small mute">Code: ${esc(S.store.reason)}</div></div></div>`;
      return;
    }
    setupDictation();
    S.store.onDoc('config/main', (c) => {
      S.config = c;
      const sid = c && c.activeSessionId;
      if (sid !== S.sid) {
        const ended = S.sid;
        if (sid && !ended && S.cfgSeen) S.announceNight = sid; // started while this page was open
        subscribeSession(sid);
        if (!sid && ended) openNight(ended); // night just ended → show its final result
      }
      else render();
      S.cfgSeen = true;
    }, onErr);
    subscribeNights();
    render();
  })();
})();

</script></body></html>
